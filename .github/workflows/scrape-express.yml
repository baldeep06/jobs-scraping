name: scrape-express
# GitHub's cron fires only every few hours on a quiet repo, so each run polls on its own clock
# (every minute for ~55 minutes) and then starts its successor. The queued successor waits
# in the concurrency group until this run ends. The cron is only a restart if the chain breaks.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-express
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Scrape the express lane every minute
        run: uv run python -m scraper run --lane express --loop-minutes 55 --every-seconds 60
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Start the next run
        if: success()
        run: gh workflow run scrape-express.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
